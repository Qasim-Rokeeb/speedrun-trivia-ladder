<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speedrun Trivia Ladder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* ===== RESET & BASE ===== */
      :root {
        --bg-void: #0a0a0f;
        --bg-surface: #111118;
        --bg-elevated: #1a1a24;
        --bg-glass: rgba(17, 17, 24, 0.88);
        --border: #26262e;
        --border-subtle: rgba(255,255,255,0.06);
        --border-medium: rgba(255,255,255,0.1);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --text-dim: #475569;
        --success: #4ade80;
        --success-glow: rgba(74, 222, 128, 0.4);
        --success-bg: rgba(74, 222, 128, 0.06);
        --success-border: rgba(74, 222, 128, 0.18);
        --danger: #f87171;
        --danger-glow: rgba(248, 113, 113, 0.4);
        --warning: #facc15;
        --gold: #fbbf24;
        --silver: #cbd5e1;
        --bronze: #fb923c;
        --tier1: #00f0ff;
        --tier1-glow: rgba(0, 240, 255, 0.3);
        --tier1-dim: #006b73;
        --tier1-bg: rgba(0, 240, 255, 0.06);
        --tier1-border: rgba(0, 240, 255, 0.18);
        --tier2: #c084fc;
        --tier2-glow: rgba(192, 132, 252, 0.3);
        --tier2-dim: #6b21a8;
        --tier2-bg: rgba(192, 132, 252, 0.06);
        --tier2-border: rgba(192, 132, 252, 0.18);
        --tier3: #fb923c;
        --tier3-glow: rgba(251, 146, 60, 0.3);
        --tier3-dim: #9a3412;
        --tier3-bg: rgba(251, 146, 60, 0.06);
        --tier3-border: rgba(251, 146, 60, 0.18);
        --font-display: 'JetBrains Mono', 'SF Mono', monospace;
        --font-body: 'Inter', -apple-system, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
        --radius: 6px;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: var(--font-body);
        color: var(--text-primary);
        background: var(--bg-void);
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* ===== AMBIENT LAYERS ===== */
      .vignette {
        position: fixed; inset: 0; z-index: 9998; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.6) 100%);
      }
      .crt-overlay {
        position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.22;
        background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
      }
      /* Subtle background gradient glow — gives depth to the void */
      .bg-glow {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background:
          radial-gradient(ellipse 60% 40% at 20% 50%, rgba(192,132,252,0.06) 0%, transparent 70%),
          radial-gradient(ellipse 50% 40% at 80% 30%, rgba(0,240,255,0.04) 0%, transparent 70%);
      }
      .particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
      .particle {
        position: absolute; border-radius: 50%;
        background: var(--tier2); opacity: 0.1;
        animation: particleDrift linear infinite;
      }
      @keyframes particleDrift {
        0%   { transform: translateY(0) translateX(0); opacity: 0; }
        10%  { opacity: 0.1; }
        90%  { opacity: 0.1; }
        100% { transform: translateY(-100vh) translateX(30px); opacity: 0; }
      }

      /* ===== CREATOR NAV BUTTON ===== */
      /* A slim fixed top bar — height tracked via --nav-h for spacing downstream */
      :root { --nav-h: 44px; }
      .creator-nav {
        position: fixed; top: 0; left: 0; right: 0;
        height: var(--nav-h);
        z-index: 500;
        display: flex; justify-content: space-between; align-items: center;
        padding: 0 16px;
        background: rgba(10,10,15,0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255,255,255,0.05);
      }
      .creator-nav-btn {
        display: inline-flex; align-items: center; gap: 7px;
        font-family: var(--font-mono); font-size: 11px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.12em;
        text-decoration: none;
        color: var(--text-secondary);
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 999px;
        padding: 5px 14px 5px 10px;
        transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
      }
      .creator-nav-btn svg {
        width: 13px; height: 13px; flex-shrink: 0; opacity: 0.75;
        transition: opacity 0.2s, transform 0.2s;
      }
      .creator-nav-btn:hover {
        color: var(--tier2);
        border-color: var(--tier2-border);
        background: rgba(192,132,252,0.1);
        box-shadow: 0 0 14px rgba(192,132,252,0.2);
      }
      .creator-nav-btn:hover svg { opacity: 1; transform: rotate(-8deg); }

      /* ===== LAYOUT ===== */
      html { -webkit-text-size-adjust: 100%; }
      #app { position: relative; z-index: 1; min-height: 100vh; padding-top: var(--nav-h); }
      .layout {
        display: grid;
        grid-template-columns: 108px minmax(0, 1fr) 300px;
        min-height: calc(100vh - var(--nav-h));
        max-width: 1280px;
        margin: 0 auto;
        align-items: start;
        gap: 0;
      }
      .main-stage {
        padding: 48px 32px 56px 20px;
        display: flex; flex-direction: column; gap: 28px;
        justify-content: center;
        min-height: calc(100vh - var(--nav-h));
        min-width: 0;
      }

      /* ===== LADDER SPINE ===== */
      .ladder-spine {
        position: sticky; top: var(--nav-h); height: calc(100vh - var(--nav-h));
        display: flex; flex-direction: column; justify-content: center;
        padding: 28px 14px;
        border-right: 1px solid rgba(148,163,184,0.12);
        background: linear-gradient(180deg, rgba(15,15,20,0.97), rgba(10,10,15,0.4));
        z-index: 10;
      }
      .ladder-spine-inner {
        display: flex; flex-direction: column-reverse; gap: 8px;
        align-items: center;
        padding: 8px 0;
        position: relative;
      }
      .ladder-spine::before {
        content: ''; position: absolute; inset: 20% 10% 20% 10%;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(192,132,252,0.12), transparent 70%);
        pointer-events: none;
      }
      .spine-rung {
        width: 52px; height: 8px;
        border-radius: 999px;
        background: rgba(148,163,184,0.1);
        position: relative;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid rgba(148,163,184,0.1);
      }
      .spine-rung.future { animation: rungPulse 2.5s ease-in-out infinite; }
      .spine-rung.completed {
        background: var(--rung-color, var(--tier1));
        box-shadow: 0 0 8px var(--rung-color, var(--tier1));
      }
      .spine-rung.active {
        background: var(--rung-color, var(--tier2));
        box-shadow: 0 0 12px var(--rung-color, var(--tier2)), 0 0 28px var(--rung-color, var(--tier2));
        animation: rungGlow 1.2s ease-in-out infinite;
      }
      .spine-rung .climber-dot {
        position: absolute; right: -12px; top: 50%; transform: translateY(-50%);
        width: 10px; height: 10px; border-radius: 50%;
        background: var(--rung-color, var(--tier2));
        box-shadow: 0 0 8px var(--rung-color, var(--tier2)), 0 0 18px var(--rung-color, var(--tier2));
        opacity: 0; transition: opacity 0.3s;
      }
      .spine-rung.active .climber-dot { opacity: 1; animation: dotPulse 1s ease-in-out infinite; }
      .spine-rung-num {
        position: absolute; left: -22px; top: 50%; transform: translateY(-50%);
        font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);
        font-variant-numeric: tabular-nums; text-align: right;
      }
      .spine-rung.active .spine-rung-num,
      .spine-rung.completed .spine-rung-num { color: var(--rung-color, var(--tier2)); font-weight: 700; }
      .spine-tier-label {
        font-family: var(--font-mono); font-size: 7px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.2em;
        color: var(--label-color, var(--text-muted));
        text-align: center; opacity: 0.85; margin: 2px 0;
      }
      .spine-tier-sep {
        width: 55%; height: 1px; margin: 0 auto;
        background: var(--sep-color, var(--border)); opacity: 0.4;
      }
      @keyframes rungPulse  { 0%,100% { opacity: 0.28; } 50% { opacity: 0.48; } }
      @keyframes rungGlow   { 0%,100% { box-shadow: 0 0 8px var(--rung-color); } 50% { box-shadow: 0 0 20px var(--rung-color), 0 0 40px var(--rung-color); } }
      @keyframes dotPulse   { 0%,100% { transform: translateY(-50%) scale(1); } 50% { transform: translateY(-50%) scale(1.35); } }

      /* ===== GLASS / NEON CARD ===== */
      .glass {
        background: var(--bg-glass);
        backdrop-filter: blur(20px) saturate(1.3);
        -webkit-backdrop-filter: blur(20px) saturate(1.3);
        border: 1px solid var(--border-medium);
        border-radius: var(--radius);
        box-shadow: 0 4px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
      }
      .neon-card {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        position: relative; overflow: hidden;
      }
      .neon-card::before {
        content: ''; position: absolute; inset: 0;
        border-radius: var(--radius);
        border: 1px solid var(--neon, var(--tier2));
        box-shadow: 0 0 24px var(--neon-glow, var(--tier2-glow)), inset 0 0 24px var(--neon-glow, var(--tier2-glow));
        opacity: 0.4; pointer-events: none;
      }

      /* ===== LOBBY / INTRO ===== */
      .intro {
        max-width: 540px;
        padding: 36px 40px 40px;
      }
      /* Gradient pack-id line */
      .intro-eyebrow {
        display: inline-flex; align-items: center; gap: 8px;
        font-family: var(--font-mono); font-size: 11px; font-weight: 700;
        letter-spacing: 0.16em; text-transform: uppercase;
        margin-bottom: 16px;
      }
      .intro-eyebrow .dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: var(--tier2);
        box-shadow: 0 0 8px var(--tier2-glow);
        animation: dotPing 2s ease-in-out infinite;
      }
      @keyframes dotPing {
        0%,100% { box-shadow: 0 0 4px var(--tier2-glow); }
        50%      { box-shadow: 0 0 12px var(--tier2-glow), 0 0 24px var(--tier2-glow); }
      }
      .intro-eyebrow .label { color: var(--tier2); }
      .intro-eyebrow .sep { color: var(--text-dim); }
      .intro-eyebrow .live-label {
        color: var(--success); font-size: 10px;
        padding: 2px 8px; border-radius: 999px;
        border: 1px solid var(--success-border);
        background: var(--success-bg);
      }

      /* Title with gradient accent */
      .intro h1 {
        font-family: var(--font-display);
        font-size: clamp(2rem, 4.5vw, 3.4rem);
        font-weight: 800; line-height: 1; letter-spacing: -0.03em;
        margin-bottom: 6px;
      }
      .intro h1 .grad {
        background: linear-gradient(135deg, #c084fc 0%, #818cf8 50%, #00f0ff 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* How-it-works rule pills */
      .intro-desc {
        color: var(--text-secondary); line-height: 1.65;
        margin: 16px 0 24px; font-size: 14.5px;
      }
      .rule-pills {
        display: flex; flex-wrap: wrap; gap: 8px;
        margin-bottom: 28px;
      }
      .rule-pill {
        display: inline-flex; align-items: center; gap: 6px;
        font-family: var(--font-mono); font-size: 11px; font-weight: 600;
        padding: 5px 12px; border-radius: 999px;
        border: 1px solid var(--border-medium);
        background: rgba(255,255,255,0.03);
        color: var(--text-secondary);
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      .rule-pill .pill-icon { font-size: 13px; }
      .rule-pill.accent-t1 { border-color: var(--tier1-border); color: var(--tier1); background: var(--tier1-bg); }
      .rule-pill.accent-t2 { border-color: var(--tier2-border); color: var(--tier2); background: var(--tier2-bg); }
      .rule-pill.accent-t3 { border-color: var(--tier3-border); color: var(--tier3); background: var(--tier3-bg); }
      .rule-pill.accent-green { border-color: var(--success-border); color: var(--success); background: var(--success-bg); }

      /* Stat header label */
      .stat-header {
        font-family: var(--font-mono); font-size: 10px; font-weight: 700;
        letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--text-muted); margin-bottom: 12px;
        display: flex; align-items: center; gap: 8px;
      }
      .stat-header::after {
        content: ''; flex: 1; height: 1px; background: var(--border);
      }

      /* Stat cards grid */
      .stat-cards {
        display: grid; grid-template-columns: repeat(4, 1fr);
        gap: 10px; margin-bottom: 32px;
      }
      .stat-card {
        border-radius: 6px; padding: 16px 10px 14px;
        text-align: center;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        position: relative; overflow: hidden;
      }
      .stat-card::after {
        content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
        background: var(--stat-line, var(--tier2)); opacity: 0.6;
      }
      .stat-card:hover { transform: translateY(-3px); }
      .stat-card--t1 { background: var(--tier1-bg); border: 1px solid var(--tier1-border); --stat-line: var(--tier1); }
      .stat-card--t2 { background: var(--tier2-bg); border: 1px solid var(--tier2-border); --stat-line: var(--tier2); }
      .stat-card--t3 { background: var(--tier3-bg); border: 1px solid var(--tier3-border); --stat-line: var(--tier3); }
      .stat-card--speed { background: var(--success-bg); border: 1px solid var(--success-border); --stat-line: var(--success); }
      .stat-card .stat-icon { font-size: 16px; margin-bottom: 6px; line-height: 1; }
      .stat-card .stat-value {
        font-family: var(--font-mono); font-size: 20px; font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .stat-card--t1 .stat-value { color: var(--tier1); }
      .stat-card--t2 .stat-value { color: var(--tier2); }
      .stat-card--t3 .stat-value { color: var(--tier3); }
      .stat-card--speed .stat-value { color: var(--success); }
      .stat-card .stat-label {
        font-family: var(--font-mono); font-size: 9px; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.1em;
        color: var(--text-muted); margin-top: 4px;
      }

      /* CTA button */
      .btn {
        font-family: var(--font-mono); font-weight: 700;
        border: none; border-radius: 4px; cursor: pointer;
        transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        text-transform: uppercase; letter-spacing: 0.08em;
      }
      .btn:disabled { opacity: 0.4; cursor: default; }
      .btn-cta {
        background: linear-gradient(135deg, #c084fc 0%, #7c3aed 100%);
        color: #0a0a0f; font-size: 15px;
        padding: 16px 40px; width: 100%;
        box-shadow: 0 0 28px rgba(192,132,252,0.35);
        animation: ctaPulse 3s ease-in-out infinite;
        border-radius: 4px;
        display: flex; align-items: center; justify-content: center; gap: 10px;
      }
      .btn-cta .cta-arrow {
        font-size: 18px; line-height: 1;
        transition: transform 0.2s;
      }
      .btn-cta:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 0 50px rgba(192,132,252,0.55), 0 8px 32px rgba(0,0,0,0.4);
      }
      .btn-cta:hover:not(:disabled) .cta-arrow { transform: translateX(4px); }
      .btn-cta:active:not(:disabled) { transform: translateY(0); }
      .btn-ghost {
        background: var(--bg-elevated); color: var(--text-primary);
        border: 1px solid var(--border); font-size: 13px; padding: 10px 20px;
      }
      .btn-ghost:hover:not(:disabled) { border-color: var(--tier2); background: rgba(192,132,252,0.08); }
      .btn-buy {
        background: var(--bg-elevated); color: var(--tier1);
        border: 1px solid var(--tier1-dim); font-size: 13px;
        padding: 12px 20px; width: 100%; margin-top: 12px;
      }
      .btn-buy:hover:not(:disabled) { border-color: var(--tier1); box-shadow: 0 0 15px var(--tier1-glow); }
      @keyframes ctaPulse {
        0%,100% { box-shadow: 0 0 28px rgba(192,132,252,0.35); }
        50%      { box-shadow: 0 0 44px rgba(192,132,252,0.5);  }
      }

      /* ===== QUESTION SCREEN ===== */
      .question-card {
        padding: 32px 36px;
        max-width: 640px; width: 100%;
        --neon: var(--tier2); --neon-glow: var(--tier2-glow);
      }
      .question-header {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 24px; gap: 12px;
      }
      .rung-counter {
        font-family: var(--font-mono); font-size: 12px; font-weight: 600;
        color: var(--text-muted); letter-spacing: 0.06em; white-space: nowrap;
      }
      .tier-badge {
        display: inline-flex; align-items: center; gap: 6px;
        font-family: var(--font-mono); font-size: 11px; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.1em;
        padding: 5px 14px; border-radius: 999px;
        border: 1px solid var(--badge-color, var(--tier2));
        background: color-mix(in srgb, var(--badge-color, var(--tier2)) 10%, transparent);
        color: var(--badge-color, var(--tier2));
        animation: badgeBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      @keyframes badgeBounce { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
      .question-prompt {
        font-family: var(--font-body); font-size: 19px; font-weight: 600;
        line-height: 1.5; color: var(--text-primary);
        margin-bottom: 28px; min-height: 3em; overflow-wrap: break-word;
      }

      /* ===== ANSWER GRID ===== */
      .answer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .answer-tile {
        display: flex; align-items: center; gap: 14px;
        background: rgba(255,255,255,0.02); border: 1px solid rgba(51,65,85,0.8);
        border-radius: 4px; padding: 16px 18px;
        font-family: var(--font-body); font-size: 14.5px; font-weight: 500;
        color: var(--text-primary); cursor: pointer;
        transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative; overflow: hidden; min-width: 0; text-align: left;
      }
      .answer-tile > span:last-child { overflow-wrap: break-word; min-width: 0; }
      .answer-tile:hover:not(:disabled) {
        border-color: var(--neon, var(--tier2));
        background: color-mix(in srgb, var(--neon, var(--tier2)) 6%, transparent);
        box-shadow: 0 0 18px var(--neon-glow, var(--tier2-glow));
        transform: translateY(-1px);
      }
      .answer-tile:active:not(:disabled) { transform: scale(0.99) translateY(0); }
      .answer-tile:disabled { cursor: default; }
      .answer-tile .tile-key {
        font-family: var(--font-mono); font-size: 12px; font-weight: 800;
        color: var(--neon, var(--tier2));
        width: 26px; height: 26px; display: grid; place-items: center;
        border: 1px solid rgba(255,255,255,0.1); border-radius: 3px;
        flex-shrink: 0; background: rgba(255,255,255,0.03);
      }
      .answer-tile.correct {
        border-color: var(--success); background: rgba(74,222,128,0.08);
        box-shadow: 0 0 20px var(--success-glow);
        animation: correctPulse 0.4s ease;
      }
      .answer-tile.wrong {
        border-color: var(--danger); background: rgba(248,113,113,0.08);
        box-shadow: 0 0 20px var(--danger-glow);
        animation: wrongShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97);
      }
      .answer-tile.picked {
        border-color: var(--neon, var(--tier2));
        background: color-mix(in srgb, var(--neon, var(--tier2)) 10%, transparent);
      }
      @keyframes correctPulse {
        0%   { box-shadow: 0 0 5px var(--success-glow); }
        50%  { box-shadow: 0 0 30px var(--success-glow), 0 0 60px var(--success-glow); }
        100% { box-shadow: 0 0 15px var(--success-glow); }
      }
      @keyframes wrongShake {
        10%,90% { transform: translateX(-2px); }
        20%,80% { transform: translateX(4px); }
        30%,50%,70% { transform: translateX(-5px); }
        40%,60% { transform: translateX(5px); }
      }
      .keyboard-hint {
        font-family: var(--font-mono); font-size: 10px;
        color: var(--text-dim); text-align: center;
        margin-top: 10px; letter-spacing: 0.08em; opacity: 0.65;
      }

      /* ===== TIMER ===== */
      .timer-wrap {
        margin-top: 24px;
        display: flex; align-items: center; gap: 16px;
      }
      .timer-bar-wrap {
        flex: 1; position: relative; height: 6px;
        background: rgba(255,255,255,0.06); border-radius: 999px; overflow: hidden;
      }
      .timer-bar-fill {
        height: 100%; border-radius: 999px;
        transition: width 0.1s linear;
        background: var(--timer-color, var(--tier2));
        box-shadow: 0 0 8px var(--timer-color, var(--tier2));
      }
      .timer-number {
        font-family: var(--font-mono); font-size: 28px; font-weight: 800;
        font-variant-numeric: tabular-nums;
        color: var(--text-primary);
        text-shadow: 0 0 12px var(--timer-glow, var(--tier2-glow));
        transition: color 0.3s; min-width: 60px; text-align: right;
        flex-shrink: 0;
      }
      .timer-number.warning { color: var(--warning); text-shadow: 0 0 12px rgba(250,204,21,0.4); }
      .timer-number.danger {
        color: var(--danger); text-shadow: 0 0 12px var(--danger-glow);
        animation: timerUrgent 0.5s ease infinite;
      }
      @keyframes timerUrgent { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

      /* ===== SCORE HUD ===== */
      .score-hud {
        display: flex; align-items: baseline; gap: 8px; font-family: var(--font-mono);
      }
      .score-hud .score-label {
        font-size: 10px; font-weight: 600; text-transform: uppercase;
        letter-spacing: 0.12em; color: var(--text-muted);
      }
      .score-hud .score-value {
        font-size: 26px; font-weight: 800;
        font-variant-numeric: tabular-nums; color: var(--text-primary);
      }
      .score-hud .score-best { font-size: 11px; color: var(--text-muted); }
      .float-score {
        position: absolute; pointer-events: none;
        font-family: var(--font-mono); font-size: 17px; font-weight: 800;
        color: var(--success); animation: floatUp 0.8s ease-out forwards;
      }
      @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-40px); } }

      /* ===== LEADERBOARD ===== */
      .leaderboard {
        position: sticky;
        top: calc(var(--nav-h) + 20px);
        padding: 20px;
        max-height: calc(100vh - var(--nav-h) - 40px);
        overflow-y: auto;
        margin-top: 20px;
        background: var(--bg-glass);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border-medium);
        border-radius: var(--radius);
        box-shadow: 0 4px 24px rgba(0,0,0,0.35);
        /* Smooth scroll within the panel */
        scroll-behavior: smooth;
      }
      .leaderboard h3 {
        font-family: var(--font-mono); font-size: 11px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.16em;
        color: var(--text-secondary);
        padding-bottom: 12px; margin-bottom: 0;
        border-bottom: 1px solid rgba(192,132,252,0.25);
        display: flex; align-items: center; gap: 8px;
      }
      /* Live dot before the heading text */
      .leaderboard h3::before {
        content: ''; width: 7px; height: 7px; border-radius: 50%;
        background: var(--tier2); flex-shrink: 0;
        box-shadow: 0 0 6px var(--tier2-glow);
        animation: dotPing 2.5s ease-in-out infinite;
      }
      .led-meta {
        display: flex; justify-content: space-between;
        font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
        padding: 10px 0 10px; margin-bottom: 10px;
        border-bottom: 1px solid var(--border);
      }
      .round-countdown { color: var(--text-secondary); }
      .round-countdown.urgent { color: var(--danger); text-shadow: 0 0 10px rgba(248,113,113,0.35); }
      .standings { list-style: none; display: grid; gap: 5px; }
      .standings li {
        display: flex; align-items: center; gap: 10px;
        padding: 9px 10px; border-radius: 4px;
        background: var(--bg-surface); border-left: 3px solid transparent;
        transition: background 0.15s;
      }
      .standings li.rank-1 { border-left-color: var(--gold); background: rgba(251,191,36,0.04); }
      .standings li.rank-1 .rank { color: var(--gold); font-weight: 700; }
      .standings li.rank-1 .name  { color: var(--gold); font-weight: 600; }
      .standings li.rank-2 { border-left-color: var(--silver); }
      .standings li.rank-2 .rank { color: var(--silver); }
      .standings li.rank-3 { border-left-color: var(--bronze); }
      .standings li.rank-3 .rank { color: var(--bronze); }
      .standings li.me { background: rgba(192,132,252,0.07); border-left-color: var(--tier2); }
      .standings .rank {
        font-family: var(--font-mono); font-size: 12px; color: var(--text-muted);
        width: 18px; text-align: center; font-variant-numeric: tabular-nums; flex-shrink: 0;
      }
      .standings .name { flex: 1; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .standings .led-score {
        font-family: var(--font-mono); font-size: 12px; font-weight: 700;
        font-variant-numeric: tabular-nums; flex-shrink: 0;
      }
      .standings .led-score em { font-style: normal; font-size: 9px; color: var(--text-muted); margin-left: 2px; }
      .standings .empty {
        color: var(--text-muted); font-size: 13px; padding: 20px 10px; text-align: center;
        background: rgba(148,163,184,0.03); border: 1px dashed rgba(148,163,184,0.12);
        border-radius: 4px; line-height: 1.6;
      }

      /* ===== END SCREEN ===== */
      .end { max-width: 460px; text-align: center; padding: 36px 40px 40px; }
      .end .eyebrow {
        font-family: var(--font-mono); font-size: 11px; font-weight: 700;
        letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--tier2); margin-bottom: 8px;
      }
      .run-stats-grid {
        display: grid; grid-template-columns: repeat(3, 1fr);
        gap: 10px; margin: 20px 0;
      }
      .run-stat {
        background: rgba(255,255,255,0.03); border: 1px solid var(--border);
        border-radius: 6px; padding: 14px 8px;
      }
      .run-stat-val { font-family: var(--font-mono); font-size: 17px; font-weight: 800; color: var(--tier1); }
      .run-stat-lab { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; color: var(--text-muted); margin-top: 4px; letter-spacing: 0.08em; }
      .final-score {
        font-family: var(--font-mono);
        font-size: clamp(3rem, 10vw, 5rem);
        font-weight: 900; font-variant-numeric: tabular-nums;
        margin: 16px 0 10px;
        background: linear-gradient(135deg, #fbbf24, #fb923c);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 0 16px rgba(251,191,36,0.35));
      }
      .end.gold .final-score {
        background: linear-gradient(135deg, #fbbf24, #f59e0b, #fb923c);
        -webkit-background-clip: text; background-clip: text;
        filter: drop-shadow(0 0 24px rgba(251,191,36,0.5));
      }
      .confetti-text { color: var(--warning); font-weight: 700; font-size: 14px; margin: 6px 0 20px; }
      .end-sub { color: var(--text-secondary); font-size: 14px; line-height: 1.6; margin: 10px 0; }

      /* ===== ANIMATIONS ===== */
      .screen-shake { animation: screenShake 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
      @keyframes screenShake {
        10%,90%     { transform: translateX(-2px); }
        20%,80%     { transform: translateX(4px); }
        30%,50%,70% { transform: translateX(-5px); }
        40%,60%     { transform: translateX(5px); }
      }
      .answer-tile.key-flash .tile-key {
        background: var(--neon, var(--tier2)); color: #0a0a0f;
        box-shadow: 0 0 12px var(--neon-glow, var(--tier2-glow));
        transition: background 0.05s, color 0.05s;
      }
      .screen-fade-in { animation: screenFadeIn 0.3s ease-out both; }
      @keyframes screenFadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* ===== RESPONSIVE ===== */

      /* ── 1100px: slim columns ── */
      @media (max-width: 1100px) {
        .layout { grid-template-columns: 80px minmax(0,1fr) 260px; }
        .main-stage { padding: 40px 20px 40px 12px; }
        .leaderboard { padding: 16px; max-height: calc(100vh - 80px); }
      }

      /* ── 1023px: 2-col layout, leaderboard as collapsible side panel ── */
      @media (max-width: 1023px) {
        .layout { grid-template-columns: 68px 1fr; }
        .main-stage { padding: 24px 28px 40px; }
        .leaderboard {
          position: fixed;
          right: 0; top: var(--nav-h);
          width: 256px; margin: 0;
          max-height: calc(100vh - var(--nav-h));
          border-radius: var(--radius) 0 0 var(--radius);
          border-right: none;
          z-index: 90;
          box-shadow: -4px 0 32px rgba(0,0,0,0.5);
          transform: translateX(calc(100% - 36px));
          transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        .leaderboard[data-open="true"] { transform: translateX(0); }
        .leaderboard h3 { cursor: pointer; user-select: none; }
        /* Pull-tab icon on the exposed left edge */
        .leaderboard::before {
          content: "\22A1";
          position: absolute;
          left: 0; top: 50%; transform: translate(-100%, -50%);
          width: 24px; padding: 10px 5px;
          background: var(--bg-glass);
          border: 1px solid var(--border-medium);
          border-right: none;
          border-radius: 6px 0 0 6px;
          font-size: 12px; color: var(--tier2);
          text-align: center; line-height: 1;
          backdrop-filter: blur(12px);
          cursor: pointer;
        }
        .leaderboard[data-open="true"]::before { display: none; }
      }

      /* ── 900px: single-column, horizontal spine, bottom-sheet leaderboard ── */
      @media (max-width: 900px) {
        .layout { grid-template-columns: 1fr; }

        .ladder-spine {
          position: sticky;
          top: var(--nav-h);
          height: auto; width: 100%;
          flex-direction: row; justify-content: center;
          border-right: none; border-bottom: 1px solid var(--border-subtle);
          padding: 8px 16px;
          z-index: 20;
          background: rgba(10,10,15,0.92);
          backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .ladder-spine-inner { flex-direction: row; gap: 5px; padding: 0; }
        .spine-rung { width: 100%; height: 5px; flex: 1; max-width: 36px; }
        .spine-rung-num, .spine-tier-label, .spine-tier-sep { display: none; }
        .spine-rung .climber-dot { right: 50%; top: -8px; transform: translateX(50%); }
        .ladder-spine::before { display: none; }

        .main-stage { padding: 20px 16px 80px; min-height: auto; justify-content: flex-start; }
        .stat-cards { grid-template-columns: repeat(4, 1fr); gap: 8px; }

        .leaderboard {
          position: fixed !important;
          left: 0; right: 0; bottom: 0; top: auto !important;
          width: 100%; margin: 0;
          max-height: 48vh;
          border-radius: 16px 16px 0 0;
          border-right: 1px solid var(--border-medium);
          border-bottom: none;
          z-index: 100;
          box-shadow: 0 -6px 40px rgba(0,0,0,0.6);
          overflow-y: auto;
          padding: 0;
          transform: translateY(calc(100% - 56px)) !important;
          transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .leaderboard[data-open="true"] { transform: translateY(0) !important; }
        .leaderboard:not([data-open="true"]) { transform: translateY(calc(100% - 56px)) !important; }
        .leaderboard::before { display: none !important; }

        .leaderboard h3 {
          position: relative;
          cursor: pointer; user-select: none;
          background: var(--bg-glass);
          backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
          padding: 20px 20px 12px;
          margin: 0; border-radius: 16px 16px 0 0;
          border-bottom: 1px solid rgba(192,132,252,0.2);
          writing-mode: horizontal-tb;
        }
        .leaderboard h3::after {
          content: '';
          position: absolute;
          top: 8px; left: 50%; transform: translateX(-50%);
          width: 40px; height: 4px;
          border-radius: 999px;
          background: rgba(255,255,255,0.22);
          pointer-events: none;
        }
        .leaderboard .led-meta { margin: 0 20px; padding: 10px 0; }
        .leaderboard .standings { padding: 0 20px 24px; }
        .leaderboard .btn-buy { margin: 0 20px 24px; width: calc(100% - 40px); }

        .intro { padding: 24px 20px 28px; max-width: 100%; }
        .end   { padding: 24px 20px 28px; max-width: 100%; }
      }

      /* ── 640px: phones ── */
      @media (max-width: 640px) {
        .creator-nav { padding: 0 12px; }
        .creator-nav-btn { font-size: 10px; padding: 5px 12px 5px 9px; gap: 5px; }

        .main-stage { padding: 16px 14px 80px; }

        .intro { padding: 20px 16px 24px; }
        .intro h1 { font-size: clamp(1.75rem, 6.5vw, 2.4rem); }
        .intro-desc { font-size: 13px; margin: 12px 0 18px; }
        .intro-eyebrow { font-size: 10px; margin-bottom: 12px; }

        .rule-pills { gap: 6px; margin-bottom: 20px; }
        .rule-pill { font-size: 10px; padding: 4px 9px; }

        .stat-cards { grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 20px; }
        .stat-card { padding: 14px 8px 12px; }
        .stat-card .stat-icon { font-size: 15px; margin-bottom: 4px; }
        .stat-card .stat-value { font-size: 18px; }
        .stat-card .stat-label { font-size: 8px; }

        .btn-cta { font-size: 13px; padding: 14px 24px; }

        .question-card { padding: 20px 16px; }
        .question-prompt { font-size: 16px; min-height: 2.5em; margin-bottom: 20px; }
        .answer-grid { grid-template-columns: 1fr; gap: 8px; }
        .answer-tile { padding: 14px 14px; font-size: 14px; }
        .tier-badge { font-size: 10px; padding: 4px 10px; }
        .rung-counter { font-size: 11px; }
        .keyboard-hint { display: none; }
        .timer-number { font-size: 22px; min-width: 50px; }

        .score-hud .score-value { font-size: 22px; }

        .end { padding: 22px 16px 26px; }
        .final-score { font-size: clamp(2.6rem, 16vw, 3.6rem); }
        .run-stats-grid { gap: 8px; }
        .run-stat { padding: 12px 6px; }
        .run-stat-val { font-size: 15px; }

        .leaderboard { max-height: 52vh; }
        .standings .name { font-size: 12px; }
        .standings .led-score { font-size: 11px; }
      }

      /* ── 400px: very small phones ── */
      @media (max-width: 400px) {
        .main-stage { padding: 12px 12px 80px; }
        .intro { padding: 16px 14px 20px; }
        .intro h1 { font-size: 1.7rem; }
        .stat-card .stat-value { font-size: 16px; }
        .stat-card .stat-icon { font-size: 13px; }
        .rule-pill { font-size: 9px; padding: 3px 8px; }
        .ladder-spine { padding: 7px 12px; }
        .creator-nav-btn svg { width: 12px; height: 12px; }
        .leaderboard { max-height: 55vh; }
      }
    </style>
  </head>
  <body>
    <div class="vignette"></div>
    <div class="crt-overlay"></div>
    <div class="bg-glow"></div>
    <div class="particles" id="particles"></div>

    <!-- ===== NAV BAR ===== -->
    <nav class="creator-nav" aria-label="Site navigation">
      <span style="font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-dim)">Speedrun Trivia</span>
      <a href="/creator.html" class="creator-nav-btn" aria-label="Open creator authoring">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 2l3 3-8 8H3v-3L11 2z"/>
          <path d="M9 4l3 3"/>
        </svg>
        <span class="creator-label">Creator</span>
      </a>
    </nav>

    <div id="app"></div>

    <script>
      // Ambient particles
      const pc = document.getElementById('particles');
      for (let i = 0; i < 35; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.cssText = [
          `left:${Math.random()*100}%`,
          `top:${Math.random()*100}%`,
          `animationDuration:${18+Math.random()*28}s`,
          `animationDelay:${-Math.random()*35}s`,
          `width:${1.5+Math.random()*2}px`,
          `height:${1.5+Math.random()*2}px`,
          // mix tier colors
          `background:${['#c084fc','#00f0ff','#fb923c'][Math.floor(Math.random()*3)]}`,
        ].join(';');
        pc.appendChild(p);
      }

      // Mobile leaderboard drawer toggle
      document.addEventListener('click', (ev) => {
        if (window.innerWidth > 900) return;
        const h3 = ev.target.closest('.leaderboard h3');
        if (!h3) return;
        const lb = h3.closest('.leaderboard');
        if (!lb) return;
        const isOpen = lb.getAttribute('data-open') === 'true';
        lb.setAttribute('data-open', String(!isOpen));
      });
    </script>
    <script type="module" src="/src/play.ts"></script>
  </body>
</html>
